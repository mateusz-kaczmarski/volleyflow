services:
  postgres:
    image: postgres:17
    restart: always
    container_name: volleyflow-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-volleyflow}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
