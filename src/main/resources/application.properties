spring.application.name=volleyflow

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5534/volleyflow_demo}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name = org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration,classpath:db/demo
app.jwt.secret=${JWT_SECRET:ZGVtby1qd3Qtc2VjcmV0LWZvci1sb2NhbC1kZXYtb25seS1wbGFjZWhvbGRlci0zMi1ieXRlcw==}
app.jwt.expiration-ms=3600000
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:volleyflow}
app.kafka.topics.user-account-created=account-activation-email-requested
app.kafka.topics.user-password-restart=account-restart-password-requested

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=pl.volleyflow.auth.event


app.activation.page-url=http://localhost:4200/activate
app.password-reset.page-url=http://localhost:4200/reset-password
app.mail.from=admin@volleyflow.pl
