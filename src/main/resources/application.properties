spring.application.name=volleyflow

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/volleyflow}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name = org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
app.jwt.secret=${JWT_SECRET:ZGVtby1qd3Qtc2VjcmV0LWZvci1sb2NhbC1kZXYtb25seS1wbGFjZWhvbGRlci0zMi1ieXRlcw==}
app.jwt.expiration-ms=3600000
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:volleyflow}
app.kafka.topics.user-account-created=${KAFKA_USER_ACCOUNT_CREATED_TOPIC:user-account-created}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
